name: Deploy GoldenKey Server to ECS

# 触发：push 到 master（或手动 Run workflow）
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   ECS_HOST / ECS_USER / ECS_SSH_KEY（私钥全文）/ ECS_PORT（可选，默认 22）
#   MYSQL_HOST / MYSQL_USER / MYSQL_PASSWORD / MYSQL_DATABASE / AUTH_SECRET（必填）
#   MYSQL_PORT（可选，默认 3306）
# 服务器前置条件：Node 20、pm2、MySQL 可连；目录 /opt/GoldenKeyServer 由本工作流创建/替换。
on:
  push:
    branches: [master]
  workflow_dispatch:

# 同一时间只允许一个部署；新触发自动取消旧任务，避免两个进程抢 pm2
concurrency:
  group: deploy-goldenkey-server
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DEPLOY_PATH: '/opt/GoldenKeyServer'
  PM2_APP_NAME: 'goldenkey-server'
  APP_PORT: '3001'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 缺 secrets 时直接给出清单，而不是让 scp 抛一句 Could not resolve hostname
      - name: Preflight deploy secrets
        env:
          SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          R_HOST: ${{ secrets.ECS_HOST }}
          R_USER: ${{ secrets.ECS_USER }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          set -e
          missing=""
          check() { [ -n "$2" ] || missing="$missing $1"; }
          check ECS_SSH_KEY "$SSH_KEY"
          check ECS_HOST "$R_HOST"
          check ECS_USER "$R_USER"
          if [ -n "$missing" ]; then
            echo "::error::缺少 secrets:$missing（Settings → Secrets and variables → Actions 里补上）"
            exit 1
          fi
          # 数据库参数都有默认值，缺了也能部署，但会明确提示用了什么默认值
          def() { [ -n "$2" ] || echo "::warning::$1 未配置，使用默认值 $3"; }
          def MYSQL_HOST "$MYSQL_HOST" 127.0.0.1
          def MYSQL_PORT "3306" 3306
          def MYSQL_USER "$MYSQL_USER" root
          def MYSQL_DATABASE "$MYSQL_DATABASE" goldenkey
          def MYSQL_PASSWORD "$MYSQL_PASSWORD" "（空口令）"
          [ -n "$AUTH_SECRET" ] || echo "::warning::AUTH_SECRET 未配置，将在服务器上生成一次随机密钥并持久化复用"
          echo "secrets 检查完成"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (production only)
        run: npm ci --omit=dev

      # CI 里也挡一次「npm ci 产出空壳目录」的坑（以前构建时踩过：
      # 所有包都是 0 个文件的空目录，构建成功但运行时 Cannot find package）
      - name: Verify dependencies are real
        run: |
          set -e
          for p in express mysql2 cors; do
            test -f "node_modules/$p/package.json" || { echo "::error::node_modules/$p 缺失或为空目录"; exit 1; }
          done
          echo "deps OK: $(du -sh node_modules | cut -f1)"

      - name: Syntax check
        run: |
          set -e
          for f in *.js; do
            node --check "$f"
          done
          echo "语法检查通过：$(ls *.js | wc -l | tr -d ' ') 个文件"

      - name: Package app (with node_modules)
        run: |
          set -e
          # node_modules 一起打包，服务器上不需要 npm，也不会因服务器 Node 版本差异重装
          tar czf goldenkey-server-dist.tar.gz \
            --exclude='.env' --exclude='.env.local' --exclude='*.log' \
            db.js server.js lessons.js sync-lessons.js bootstrap-db.js \
            migrate-app.js migrate-classroom.js migrate-enroll.js migrate-admin-roles.js migrate-lessons.js \
            schema.sql seed.js package.json package-lock.json .env.example node_modules
          if tar tzf goldenkey-server-dist.tar.gz | grep -qE '^(\./)?\.env$'; then
            echo "::error::.env 不得打进产物"; exit 1
          fi
          ls -lh goldenkey-server-dist.tar.gz

      - name: Upload artifact to server (scp)
        env:
          SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          R_HOST: ${{ secrets.ECS_HOST }}
          R_USER: ${{ secrets.ECS_USER }}
          R_PORT: ${{ secrets.ECS_PORT }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          echo "Uploading $(du -h goldenkey-server-dist.tar.gz | cut -f1) to ${R_HOST}:/tmp/ ..."
          timeout 300s scp -O \
            -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -P "${R_PORT:-22}" \
            goldenkey-server-dist.tar.gz "${R_USER}@${R_HOST}:/tmp/"
          echo "scp done"

      - name: Remote deploy (ssh)
        env:
          SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          R_HOST: ${{ secrets.ECS_HOST }}
          R_USER: ${{ secrets.ECS_USER }}
          R_PORT: ${{ secrets.ECS_PORT }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          timeout 600s ssh \
            -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p "${R_PORT:-22}" "${R_USER}@${R_HOST}" 'bash -s' <<'REMOTE'
          set -eo pipefail
          export PATH="$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.npm-global/bin:$HOME/.local/bin"
          DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
          APP_PORT="${{ env.APP_PORT }}"
          PM2_APP_NAME="${{ env.PM2_APP_NAME }}"
          STAGE="$(mktemp -d /tmp/gk-server-XXXXXX)"
          trap 'rm -rf "$STAGE"' EXIT

          tar xzf /tmp/goldenkey-server-dist.tar.gz -C "$STAGE"
          rm -f /tmp/goldenkey-server-dist.tar.gz

          # 业务数据全在 MySQL，代码目录整体替换；先解压到临时目录写好 .env，
          # 再原子切换，中断时旧版本仍然可用。
          # 变量名与 ReviewMaster 保持一致：MYSQL_* + AUTH_SECRET；未配置的项用括号里的默认值。
          MYSQL_HOST_V="${{ secrets.MYSQL_HOST }}"
          MYSQL_PORT_V="${{ secrets.MYSQL_PORT }}"
          MYSQL_USER_V="${{ secrets.MYSQL_USER }}"
          MYSQL_PASSWORD_V="${{ secrets.MYSQL_PASSWORD }}"
          MYSQL_DATABASE_V="${{ secrets.MYSQL_DATABASE }}"
          AUTH_SECRET_V="${{ secrets.AUTH_SECRET }}"

          # 没配 AUTH_SECRET 时：服务器上生成一次随机密钥并持久化，
          # 这样每次部署签发的 token 依然有效；等 secret 配好后会自动改用它。
          SECRET_FILE="$HOME/.goldenkey-auth"
          if [ -z "$AUTH_SECRET_V" ]; then
            if [ -s "$SECRET_FILE" ]; then
              AUTH_SECRET_V="$(cat "$SECRET_FILE")"
              echo "::notice::AUTH_SECRET 未配置，沿用服务器上已有的密钥：$SECRET_FILE"
            else
              AUTH_SECRET_V="$(openssl rand -hex 32 2>/dev/null || od -An -tx1 -N32 /dev/urandom | tr -d ' \n')"
              ( umask 077; printf '%s' "$AUTH_SECRET_V" > "$SECRET_FILE" )
              echo "::warning::AUTH_SECRET 未配置，已在服务器生成随机密钥并保存到 $SECRET_FILE"
            fi
          fi

          {
            echo 'NODE_ENV=production'
            echo 'PORT='"$APP_PORT"
            echo 'BUILD_SHA=${{ github.sha }}'
            echo 'MYSQL_HOST='"${MYSQL_HOST_V:-127.0.0.1}"
            echo 'MYSQL_PORT='"${MYSQL_PORT_V:-3306}"
            echo 'MYSQL_USER='"${MYSQL_USER_V:-root}"
            echo 'MYSQL_PASSWORD='"$MYSQL_PASSWORD_V"
            echo 'MYSQL_DATABASE='"${MYSQL_DATABASE_V:-goldenkey}"
            echo 'AUTH_SECRET='"$AUTH_SECRET_V"
          } > "$STAGE/.env"
          chmod 600 "$STAGE/.env"
          echo "=== .env written (value lengths, no values shown) ==="
          for k in MYSQL_HOST MYSQL_PORT MYSQL_USER MYSQL_PASSWORD MYSQL_DATABASE AUTH_SECRET; do
            v=$(grep "^$k=" "$STAGE/.env" | cut -d= -f2-)
            printf '%s len=%s\n' "$k" "$(printf '%s' "$v" | wc -c)"
          done
          for k in MYSQL_HOST MYSQL_USER MYSQL_DATABASE AUTH_SECRET; do
            if [ -z "$(grep "^$k=." "$STAGE/.env" || true)" ]; then
              echo "::error::$k 为空，拒绝部署"; exit 1
            fi
          done

          # 迁移脚本全部幂等（IF NOT EXISTS / 补列前先查 information_schema），可每次跑
          # 先探一次连通性：失败时把错误码和实际连接参数打进注解，省得翻日志
          echo "=== db check ==="
          cd "$STAGE"
          if ! DB_OUT=$(node --input-type=module -e "import pool from './db.js'; pool.query('SELECT 1').then(()=>{console.log('db ok'); return pool.end()}).catch(e=>{console.error((e.code||'')+' '+(e.message||e)); process.exit(1)})" 2>&1); then
            echo "$DB_OUT"
            echo "::error::数据库连接失败 host=${{ secrets.MYSQL_HOST }} user=${{ secrets.MYSQL_USER }} db=${{ secrets.MYSQL_DATABASE }}（密码不显示）：$(printf '%s' "$DB_OUT" | tail -2 | tr '\n' '|' | cut -c1-600)"
            exit 1
          fi
          echo "$DB_OUT"

          # 空库先建表 + 建初始管理员，再跑迁移（schema.sql 只有 CREATE TABLE IF NOT EXISTS，安全）
          echo "=== bootstrap ==="
          if ! BOOT_OUT=$(ADMIN_USERNAME="${{ secrets.ADMIN_USERNAME }}" ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" node bootstrap-db.js 2>&1); then
            printf '%s\n' "$BOOT_OUT"
            echo "::error::初始化数据库失败：$(printf '%s' "$BOOT_OUT" | tail -3 | tr '\n' '|' | cut -c1-600)"
            exit 1
          fi
          printf '%s\n' "$BOOT_OUT"

          echo "=== migrations ==="
          for f in migrate-app.js migrate-classroom.js migrate-enroll.js migrate-admin-roles.js migrate-lessons.js; do
            if [ -f "$f" ]; then
              echo "--- $f"
              if ! MIG_OUT=$(node "$f" 2>&1); then
                printf '%s\n' "$MIG_OUT"
                echo "::error::迁移脚本 $f 执行失败：$(printf '%s' "$MIG_OUT" | tail -4 | tr '\n' '|' | cut -c1-700)"
                exit 1
              fi
              printf '%s\n' "$MIG_OUT"
            fi
          done
          cd - > /dev/null

          # 原子切换
          rm -rf "$DEPLOY_PATH.old"
          if [ -d "$DEPLOY_PATH" ]; then mv "$DEPLOY_PATH" "$DEPLOY_PATH.old"; fi
          mv "$STAGE" "$DEPLOY_PATH"
          trap - EXIT
          chmod -R 755 "$DEPLOY_PATH"
          chmod 600 "$DEPLOY_PATH/.env"

          pm2 delete "$PM2_APP_NAME" 2>/dev/null || true
          timeout 60s env NODE_ENV=production PORT="$APP_PORT" \
            pm2 start server.js --name "$PM2_APP_NAME" --cwd "$DEPLOY_PATH" || true
          timeout 30s pm2 save || true
          sleep 3

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://127.0.0.1:$APP_PORT/goldenkey/api/health" || true)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Deploy successful! Health check returned $HTTP_CODE"
            rm -rf "$DEPLOY_PATH.old"
          else
            echo "Deploy failed! Health check returned $HTTP_CODE"
            # ssh 的输出就是本 step 的 stdout，这里用 ::error:: 可以让失败原因直接出现在
            # Actions 摘要的注解里，不必翻整段日志
            LOG=$(timeout 20s pm2 logs "$PM2_APP_NAME" --lines 30 --nostream 2>&1 | tail -20 || true)
            echo "::error::健康检查失败（HTTP ${HTTP_CODE:-000}），最后日志：$(printf '%s' "$LOG" | tr '\n' '|' | cut -c1-900)"
            # 回滚到上一版（保留旧代码与旧 .env）
            if [ -d "$DEPLOY_PATH.old" ]; then
              rm -rf "$DEPLOY_PATH"
              mv "$DEPLOY_PATH.old" "$DEPLOY_PATH"
              pm2 delete "$PM2_APP_NAME" 2>/dev/null || true
              timeout 60s env NODE_ENV=production PORT="$APP_PORT" \
                pm2 start server.js --name "$PM2_APP_NAME" --cwd "$DEPLOY_PATH" || true
              echo "Rolled back to previous version"
            fi
            exit 1
          fi
          echo "Deploy completed at $(date '+%Y-%m-%d %H:%M:%S')"
          REMOTE
